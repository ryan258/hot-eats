{{ if partial "feature-enabled.html" "story" }}
  {{ $data := partial "site-data.html" . }}
  <section class="story"><div class="wrap prose">
    <h2>{{ $data.brand.story_title }}</h2>
    {{ range $data.brand.story }}<p>{{ . }}</p>{{ end }}
    <a class="text-link" href="{{ partial "site-url.html" ("story/") }}">Read our story →</a>
  </div></section>
{{ end }}

      <path d="M48 12.7c8.3 0 14 5.9 14 14.4S56.3 41.7 48 41.7s-14-6-14-14.6 5.7-14.4 14-14.4Zm0 6.7c-4 0-6.5 3-6.5 7.7 0 4.8 2.5 7.9 6.5 7.9s6.5-3.1 6.5-7.9c0-4.7-2.5-7.7-6.5-7.7Z"/>
      <path transform="translate(64)" d="M5 6.3A1.8 1.8 0 0 1 6.8 4.5h4A1.8 1.8 0 0 1 12.6 6.3v7.1h6.5a1.6 1.6 0 0 1 1.6 1.6v3a1.6 1.6 0 0 1-1.6 1.6h-6.5v11.6c0 2.6 1.1 3.8 3.4 3.8 1.1 0 2.3-.3 3.3-.7a1 1 0 0 1 1.4.9v3.9a1.7 1.7 0 0 1-1.1 1.6 14 14 0 0 1-5.5 1C8 41.7 5 38.4 5 32V19.6H1.6A1.6 1.6 0 0 1 0 18v-3a1.6 1.6 0 0 1 1.6-1.6H5Z"/>
      <path d="M102 4h22a2 2 0 0 1 2 2v3.2a2 2 0 0 1-2 2h-16v7.6h13.5a1.8 1.8 0 0 1 1.8 1.8v3.1a1.8 1.8 0 0 1-1.8 1.8H108V34h16.5a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H102a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
      <path d="M142.9 12.7c7.9 0 12.5 4.3 12.5 11v15.6a1.7 1.7 0 0 1-1.7 1.7H150a1.5 1.5 0 0 1-1.5-1.5v-1.3c-1.8 2.1-4.5 3.5-8.6 3.5-5.7 0-9.5-3.4-9.5-8.5 0-5.4 3.9-8.1 10.8-8.6l6.7-.5v-.6c0-2.9-1.8-4.5-5.4-4.5a11.2 11.2 0 0 0-7.1 2.5 1.4 1.4 0 0 1-2-.3l-1.8-2.7a1.5 1.5 0 0 1 .3-2c2.7-2.2 6.3-3.8 11-3.8Zm5 16.6-5.4.5c-3.2.3-4.7 1.4-4.7 3.3 0 1.7 1.3 2.9 3.8 2.9 3.8 0 6.3-2.2 6.3-5.1Z"/>

    </g>
  </g>
  <path d="M52 117h712" stroke="#778B7C"/>
  <g id="headline">
    <text x="52" y="187" fill="#192D27" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="65" font-weight="750">Make it easy</text>
    <text x="52" y="251" fill="#192D27" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="65" font-weight="750">to come in.</text>
    <text x="54" y="302" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="23" font-weight="550">A configurable website kit for independent restaurants</text>
    <text x="54" y="334" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="23" font-weight="550">and the web partners who build for them.</text>
  </g>
  <g id="guest-journey">
    <rect x="52" y="372" width="712" height="268" rx="14" fill="#DDE9D8"/>
    <text x="78" y="419" fill="#192D27" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="28" font-weight="750">What guests can do</text>
    <text x="78" y="469" fill="#275344" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="22" font-weight="700">Read the menu</text>
    <text x="333" y="469" fill="#192D27" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">Browse dishes, prices and availability.</text>
    <path d="M78 488h660" stroke="#275344" stroke-opacity=".34"/>
    <text x="78" y="526" fill="#275344" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="22" font-weight="700">Plan a visit</text>
    <text x="333" y="526" fill="#192D27" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">Find hours, locations and access details.</text>
    <path d="M78 545h660" stroke="#275344" stroke-opacity=".34"/>
    <text x="78" y="585" fill="#275344" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="22" font-weight="700">Take the next step</text>
    <text x="333" y="584" fill="#192D27" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">Get directions, call or follow your</text>
    <text x="333" y="609" fill="#192D27" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">ordering or booking link where offered.</text>
  </g>
  <g id="owner-story">
    <text x="52" y="696" fill="#192D27" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="28" font-weight="750">Start with your kind</text>
    <text x="52" y="728" fill="#192D27" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="28" font-weight="750">of restaurant.</text>
    <text x="53" y="769" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">Explore nine illustrative designs. Select</text>
    <text x="53" y="795" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">the pages your restaurant needs and</text>
    <text x="53" y="821" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">replace the examples with your own</text>
    <text x="53" y="847" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">menu, hours, details and photos.</text>
    <text x="427" y="696" fill="#192D27" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="28" font-weight="750">Keep routine changes</text>
    <text x="427" y="728" fill="#192D27" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="28" font-weight="750">close at hand.</text>
    <text x="428" y="769" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">With local owner tools, preview a change</text>
    <text x="428" y="795" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">to hours or menu availability before</text>
    <text x="428" y="821" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">applying it. Your website setup controls</text>
    <text x="428" y="847" fill="#45584D" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">how changes go live.</text>
  </g>
  <g id="call-to-action">
    <rect x="52" y="908" width="712" height="96" rx="14" fill="#275344"/>
    <text x="78" y="949" fill="#F9F4E8" font-family="Bricolage Grotesque, 'Avenir Next', system-ui, sans-serif" font-size="28" font-weight="750">See the restaurant examples.</text>
    <text x="80" y="978" fill="#F9F4E8" font-family="Atkinson Hyperlegible Next, system-ui, Arial, sans-serif" font-size="18" font-weight="400">Ask for a walkthrough of the guest experience.</text>
  </g>
</svg>

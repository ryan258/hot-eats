<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 816 1056" role="img">
  <title>Hot Eats restaurant website kit one-sheet</title>
  <desc>An introduction to the Hot Eats restaurant website kit and its menu, visit and provider handoff features.</desc>
  <rect width="816" height="1056" fill="#F9F4E8"/>
  <g id="hot-eats-logo" transform="translate(46 37) scale(.77)">
    <g id="doorway" transform="translate(8 8) scale(.8)">
      <path fill="#275344" d="M18 0h44a18 18 0 0 1 18 18v44a18 18 0 0 1-18 18H18A18 18 0 0 1 0 62V18A18 18 0 0 1 18 0Z"/>
      <path fill="#F9F4E8" d="M19 65a3 3 0 0 1-3-3V34c0-13 9.8-22 24-22s24 9 24 22v28a3 3 0 0 1-6 0V34c0-9.8-7.2-16-18-16s-18 6.2-18 16v28a3 3 0 0 1-3 3Z"/>
      <path fill="#F6C96B" fill-rule="evenodd" d="M31 32a3 3 0 0 1 3.7-2.9l16 4a3 3 0 0 1 2.3 2.9v23a3 3 0 0 1-2.2 2.9l-16 4.4A3 3 0 0 1 31 63.4Z M38.4 38.3l8.5 1.7a1.65 1.65 0 0 1-.6 3.2l-8.5-1.7a1.65 1.65 0 0 1 .6-3.2Z M38 47.6h8.5a1.65 1.65 0 0 1 0 3.3H38a1.65 1.65 0 0 1 0-3.3Z"/>
    </g>
